spring.application.name=Backend-UVote

# ============================
# BASE DE DATOS
# ============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / HIBERNATE
# ============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================
# JWT
# ============================
uvote.jwt.secret=${JWT_SECRET}
uvote.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ============================
# LOGGING
# ============================
logging.level.org.springframework.security=INFO

# ============================
# ARCHIVOS
# ============================
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# ============================
# SENDGRID SMTP
# ============================
spring.mail.host=${MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:apikey}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================
# APP MAIL
# ============================
app.mail.from=${APP_MAIL_FROM}